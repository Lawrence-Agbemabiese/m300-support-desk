name: Deploy Prisma Migrations (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-deploy.yml"

permissions:
  contents: read

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma validate

      - name: Apply migrations to Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npm run prisma:migrate:deploy

      - name: Regenerate Prisma client (for completeness)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npm run prisma:generate
